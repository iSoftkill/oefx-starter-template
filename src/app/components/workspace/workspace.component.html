@if (isLoginRoute()) {
  <router-outlet></router-outlet>
} @else {
  <div class="oefa-app-layout">
    <!-- Top Institutional Header -->
    <app-header></app-header>

    <!-- Main Shell Body -->
    <div class="app-body">
      <!-- Desktop Sidebar (Rail + Submenu Drawer) -->
      @if (!navService.isMobileScreen()) {
        <app-sidebar-rail></app-sidebar-rail>
        <app-submenu-panel></app-submenu-panel>
      }

      <!-- Mobile Floating Overlay Drawer (When hamburger menu is active on mobile) -->
      @if (navService.isMobileScreen() && navService.sidebarMode() !== 'hidden') {
        <div class="mobile-sidebar-backdrop" (click)="navService.sidebarMode.set('hidden')">
          <div class="mobile-sidebar-container" (click)="$event.stopPropagation()">
            <app-mobile-nav-drawer></app-mobile-nav-drawer>
          </div>
        </div>
      }

      <!-- Main Workspace Container -->
      <main class="workspace-main" (click)="onWorkspaceClick()">
        <div class="workspace-card">
          <router-outlet></router-outlet>
        </div>
      </main>
    </div>

    <!-- Quick Action '+' Modal -->
    @if (navService.isQuickActionOpen()) {
      <div class="modal-backdrop" (click)="navService.closeQuickAction()">
        <div class="modal-dialog" (click)="$event.stopPropagation()">
          <div class="modal-header">
            <h3>Acción Rápida</h3>
            <button class="btn-close" (click)="navService.closeQuickAction()">&times;</button>
          </div>
          <div class="modal-body">
            <p class="modal-desc">Configura aquí las acciones rápidas de tu sistema.</p>
          </div>
        </div>
      </div>
    }
  </div>
}
