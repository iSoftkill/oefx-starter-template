<aside class="sidebar-rail">
  <!-- Quick Action Circular '+' Button (Adaptable) -->
  @if (shouldShowQuickAction) {
  <div class="quick-action-wrapper">
    <button class="btn-quick-add" (click)="navService.openQuickAction()" data-oefa-tooltip="Acción Rápida"
      aria-label="Acción Rápida">
      <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="5" x2="12" y2="19" />
        <line x1="5" y1="12" x2="19" y2="12" />
      </svg>
    </button>
  </div>
  }

  <!-- Navigation Rail Menu Items -->
  <nav class="rail-nav">
    @for (item of navService.navItems; track item.id) {
    <div class="rail-item-wrapper">
      <button class="rail-item" [class.active]="navService.activeItemId() === item.id" (click)="onItemClick(item)"
        (mouseenter)="onItemMouseEnter(item)" (mouseleave)="onItemMouseLeave(item)" [attr.aria-label]="item.label">
        <div class="icon-container">
          <!-- Render matching SVG icon based on item.icon -->
          <oefa-icon [name]="item.icon" [size]="22"></oefa-icon>
        </div>
        <span class="item-label">{{ item.label }}</span>
      </button>
    </div>
    }
  </nav>
</aside>
