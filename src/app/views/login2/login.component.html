        <!-- COLUMNA DERECHA: formulario de login -->
        <section class="l2-form-panel" aria-labelledby="l2-form-titulo">

            <!-- Logo OEFA -->
            <div class="l2-logo">
                <img class="l2-logo__img" src="/images/logo_oefa_primary.svg"
                    alt="OEFA - Organismo de Evaluación y Fiscalización Ambiental" width="208" height="48" />
            </div>

            <h2 id="l2-form-titulo" class="l2-form-panel__titulo">Iniciar Sesión</h2>

            @if (error()) {
            <div class="l2-alert" role="alert">{{ error() }}</div>
            }

            <form class="l2-form" [formGroup]="formulario" (ngSubmit)="ingresar()" novalidate>

                <!-- Campo Usuario -->
                <div class="l2-field">
                    <label class="l2-field__label" for="l2-usuario">Usuario</label>
                    <div class="l2-field__input-wrap">
                        <span class="l2-field__icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                                <circle cx="12" cy="7" r="4" />
                            </svg>
                        </span>
                        <input id="l2-usuario" class="l2-field__input" type="text" formControlName="usuario"
                            autocomplete="username" placeholder="Ingrese su usuario"
                            [attr.aria-invalid]="formulario.controls.usuario.invalid && formulario.controls.usuario.touched" />
                    </div>
                </div>

                <!-- Campo Contraseña -->
                <div class="l2-field">
                    <label class="l2-field__label" for="l2-contrasena">Contraseña</label>
                    <div class="l2-field__input-wrap">
                        <span class="l2-field__icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                                <rect x="3" y="11" width="18" height="11" rx="2" />
                                <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                            </svg>
                        </span>
                        <input id="l2-contrasena" class="l2-field__input l2-field__input--password"
                            [type]="mostrarClave() ? 'text' : 'password'" formControlName="contrasena"
                            autocomplete="current-password" placeholder="Ingrese su contraseña"
                            [attr.aria-invalid]="formulario.controls.contrasena.invalid && formulario.controls.contrasena.touched" />
                        <button type="button" class="l2-field__eye"
                            [attr.aria-label]="mostrarClave() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
                            (click)="alternarClave()">
                            @if (mostrarClave()) {
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                                aria-hidden="true">
                                <path
                                    d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24" />
                                <line x1="1" y1="1" x2="23" y2="23" />
                            </svg>
                            } @else {
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                                aria-hidden="true">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                                <circle cx="12" cy="12" r="3" />
                            </svg>
                            }
                        </button>
                    </div>
                </div>

                <!-- Botón principal -->
                <oefa-button type="submit" variant="primary" size="md" [loading]="cargando()" [disabled]="cargando()"
                    class="l2-submit">
                    Iniciar Sesión
                </oefa-button>
            </form>

            <!-- Ayuda -->
            <div class="l2-ayuda">
                <p class="l2-ayuda__titulo">¿Necesitas ayuda?</p>
                <div class="l2-ayuda__opciones">
                    <a href="#" class="l2-ayuda__opcion" aria-label="Manual de Usuario">
                        <span class="l2-ayuda__opcion-icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                                <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" />
                                <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" />
                            </svg>
                        </span>
                        <span>Manual de<br>Usuario</span>
                    </a>
                    <a href="#" class="l2-ayuda__opcion" aria-label="Contactar a Soporte">
                        <span class="l2-ayuda__opcion-icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z" />
                                <polyline points="22,6 12,13 2,6" />
                            </svg>
                        </span>
                        <span>Contactar<br>a Soporte</span>
                    </a>
                </div>
            </div>

        </section>
    </div>
</main>
