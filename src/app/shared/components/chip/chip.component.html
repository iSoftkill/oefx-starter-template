<span
  class="oefa-chip"
  [class.shape-pill]="variant === 'pill'"
  [class.shape-rounded]="variant === 'rounded'"
  [class.shape-outlined]="variant === 'outlined'"
  [class.shape-filter]="variant === 'filter'"
  [class.chip-sm]="size === 'sm'"
  [class.active]="active"
  [class.clickable]="isInteractive"
  [class.disabled]="disabled"
  [ngClass]="'color-' + color"
  [attr.role]="isInteractive ? 'button' : null"
  [attr.tabindex]="isInteractive && !disabled ? 0 : null"
  [attr.aria-pressed]="isInteractive ? active : null"
  [attr.aria-disabled]="disabled ? true : null"
  [title]="title || label"
  (click)="onClick($event)"
  (keydown)="onKeyDown($event)"
>
  @if (logo) {
    @if (isImageLogo) {
      <img [src]="logo" [alt]="title || label || 'logo'" class="oefa-chip-logo" />
    } @else {
      <oefa-icon [name]="logo" size="xs" class="chip-logo" />
    }
  }

  @if (icon) {
    <oefa-icon [name]="icon" size="xs" class="chip-icon" />
  }

  <ng-content select="[icon], [logo]"></ng-content>

  @if (prefix) {
    <span class="chip-prefix">{{ prefix }}</span>
  }

  <span class="chip-label">
    @if (label) { {{ label }} } @else { <ng-content></ng-content> }
  </span>

  @if (removable) {
    <button type="button" class="chip-remove-btn" (click)="onRemove($event)" aria-label="Remover" [disabled]="disabled">
      <oefa-icon name="close" size="xs" />
    </button>
  }
</span>
